<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap">
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Games</title>
<style>
  :root {
    --bg0: #060b1a;
    --bg1: #0b1220;
    --bg2: #111827;
    --panel: rgba(12, 17, 31, 0.7);
    --panel-strong: rgba(10, 17, 31, 0.9);
    --stroke: rgba(103, 232, 255, 0.18);
    --stroke-strong: rgba(103, 232, 255, 0.42);
    --text: #dffcff;
    --muted: #9ac7d3;
    --accent: #67e8ff;
    --accent-2: #8b5cf6;
    --accent-3: #ff4fd8;
    --shadow: rgba(103, 232, 255, 0.25);
  }

  * { margin:0; padding:0; box-sizing:border-box; font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  html { overflow: hidden; background: var(--bg0); }
  html, body { height: 100%; }

  body {
    height: 100%;
    overflow-y: auto;
    overflow-x: hidden;
    max-width: 100%;
    background: transparent;
    display: flex;
    flex-direction: column;
    align-items: center;
    color: var(--text);
    position: relative;
    padding: 40px 20px 110px;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: linear-gradient(
      to bottom,
      rgba(6, 11, 26, 0.15) 0%,
      rgba(6, 11, 26, 0.35) 45%,
      rgba(6, 11, 26, 0.7) 100%
    );
    z-index: 2;
    pointer-events: none;
  }

  h1 {
    font-size: 4rem;
    font-weight: 900;
    text-align: center;
    z-index: 4;
    position: relative;
    text-shadow: 0 0 10px rgba(103, 232, 255, 0.25), 0 0 20px rgba(139, 92, 246, 0.25), 0 0 40px rgba(103, 232, 255, 0.2);
    margin-bottom: 20px;
    max-width: 95%;
    word-break: break-word;
    letter-spacing: -1px;
    text-transform: uppercase;
  }

  .wave span {
    display: inline-block;
    animation: wave 3.5s ease-in-out infinite;
  }
  @keyframes wave { 0% { transform: translateY(0); } 50% { transform: translateY(-12px); } 100% { transform: translateY(0); } }

  #mode-toggle {
    display:flex; gap:8px; z-index:4; position:relative; margin-bottom:24px; background: rgba(103, 232, 255, 0.05); border:1px solid var(--stroke); border-radius:50px; padding:4px;
  }
  .mode-btn {
    padding: 9px 26px; border-radius:50px; border:none; background:transparent; color: rgba(223, 252, 255, 0.7); font-size:0.9rem; font-weight:700; cursor:pointer; transition:all 0.2s ease; font-family:inherit; letter-spacing:0.3px;
  }
  .mode-btn:hover { color: var(--text); background: rgba(103, 232, 255, 0.06); }
  .mode-btn.active {
    background: rgba(103, 232, 255, 0.18); color: var(--text); box-shadow: 0 0 16px rgba(103, 232, 255, 0.2);
  }

  #search-container {
    width:100%; max-width:1400px; margin-bottom:26px; z-index:4; position:relative;
  }
  #search {
    width:100%; padding:16px 22px; border-radius:14px; border:1px solid var(--stroke); font-size:1rem; outline:none; background: rgba(103, 232, 255, 0.04); color: var(--text); backdrop-filter: blur(10px); transition:border-color 0.2s;
  }
  #search:focus { border-color: var(--stroke-strong); box-shadow: 0 0 0 2px rgba(103, 232, 255, 0.08); }
  #search::placeholder { color: rgba(223, 252, 255, 0.45); }

  .game-grid {
    display:grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap:25px; max-width:1400px; width:100%; z-index:4; position:relative; align-items:start;
  }
  .game-card {
    background: rgba(103, 232, 255, 0.04); border:1px solid var(--stroke); border-radius:20px; overflow:hidden; cursor:pointer; transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease; display:flex; flex-direction:column; align-items:center; text-align:center; padding:10px;
  }
  .game-card:hover {
    transform: translateY(-8px); box-shadow: 0 12px 36px rgba(103, 232, 255, 0.16); background: rgba(103, 232, 255, 0.07); border-color: var(--stroke-strong);
  }
  .game-card .img-wrap { position:relative; width:100%; margin-bottom:10px; }
  .game-card img { width:100%; aspect-ratio:1 / 1; object-fit:cover; border-radius:14px; display:block; }

  .cloud-badge {
    position:absolute; bottom:8px; left:50%; transform:translateX(-50%); display:inline-flex; align-items:center; gap:5px; background: rgba(4,8,20,0.7); border:1px solid rgba(103,232,255,0.23); border-radius:999px; padding:4px 11px 4px 8px; white-space:nowrap; pointer-events:none;
  }
  .cloud-badge .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#67e8ff; box-shadow: 0 0 6px #67e8ff, 0 0 12px rgba(103,232,255,0.5); flex:none; }
  .cloud-badge .label { font-size:0.72rem; font-weight:700; color:#e7fbff; letter-spacing:0.5px; text-transform:uppercase; }

  .game-card span {
    font-weight:700; color: var(--text); font-size:1rem; padding:4px 6px; line-height:1.2; white-space:nowrap; text-overflow:ellipsis; overflow:hidden; max-width:100%;
  }

  footer {
    position: fixed; bottom: 0; left: 0; width: 100%; display:flex; gap:28px; font-size:1.08rem; align-items:center; justify-content:center; z-index:50; backdrop-filter: blur(14px); background: linear-gradient(to top, rgba(6,11,26,0.76), rgba(6,11,26,0.32)); padding:10px 8px; border-top:1px solid rgba(103,232,255,0.08);
  }
  footer span { display:flex; align-items:center; position:relative; padding:0 6px; }
  footer > span:not(:last-child)::after { content:''; position:absolute; right:0; top:50%; transform:translateY(-50%); width:1px; height:60%; background:rgba(103,232,255,0.15); }
  .seconds { color: rgba(223, 252, 255, 0.65); font-weight:400; margin-left:-4px; }
  .ampm { color: rgba(223, 252, 255, 0.65); font-size: 0.8em; margin-left: -6px; }
  .battery { display:flex; align-items:center; gap:3px; }
  .battery svg { stroke: var(--text); }
  a { color: var(--text); text-decoration:none; }
  a:hover { text-decoration: underline; }

  @media (max-width: 999px) { .game-grid { grid-template-columns: repeat(auto-fill, minmax(200px,1fr)); gap:18px; } }
  @media (max-width: 699px) { .game-grid { grid-template-columns: repeat(auto-fill, minmax(155px,1fr)); gap:14px; } h1 { font-size:2.8rem; } }
  @media (max-width: 419px) { .game-grid { grid-template-columns: repeat(2,1fr); gap:10px; } h1 { font-size:2rem; } footer { flex-direction: row; flex-wrap: wrap; justify-content:center; } }

  body::-webkit-scrollbar { width:8px; }
  body::-webkit-scrollbar-track { background:transparent; }
  body::-webkit-scrollbar-thumb { background: rgba(103,232,255,0.2); border-radius:8px; }

  #bg-rat { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); height: 55%; width: auto; z-index: 3; pointer-events: none; opacity: 1; }
</style>
</head>
<body>
  <img id="bg-rat" src="../media/bg.gif" alt="" aria-hidden="true">

  <h1 id="page-title" class="bold">GAMES</h1>

  <div id="mode-toggle">
    <button id="btn-games" class="mode-btn active" onclick="setMode('games')">🎮 Games</button>
    <button id="btn-tools" class="mode-btn" onclick="setMode('tools')">🔧 Tools</button>
  </div>

  <div id="search-container">
    <input type="text" id="search" placeholder="Search games...">
  </div>

  <div class="game-grid" id="game-grid" aria-live="polite"></div>

  <footer>
    <span id="time">--:<span class="seconds">--</span><span class="ampm">--</span></span>
    <span class="battery">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
        <rect x="1" y="6" width="18" height="12" rx="2" ry="2"></rect>
        <line x1="23" y1="13" x2="23" y2="11"></line>
      </svg>
      <span id="battery-text">--%</span>
    </span>
    <span><a href="https://discord.gg/6Sp3DJMvCU" target="_blank" rel="noopener">Discord</a></span>
  </footer>

<script>
  const ALWAYS_PROXY = ["Roblox 2", "Fortnite 2"];
  const PROXY_PREFIX = "https://proxy.texas-projects.xyz?";
  const useProxy = localStorage.getItem('useProxy') === 'true';

  const rawGameList = `
Random, ../media/gameimages/random.gif, ../games/random.html
Roblox, ../media/cloudimages/icon_Roblox.webp, ../app/cloud.html?game=com.roblox.client, cloud
Brawl Stars, ../media/cloudimages/icon_BrawlStars.webp, ../app/cloud.html?game=com.supercell.brawlstars, cloud
Clash Royale, ../media/cloudimages/icon_ClashRoyale.webp, ../app/cloud.html?game=com.supercell.clashroyale, cloud
EA SPORTS FC™ Mobile Soccer, ../media/cloudimages/icon_EASPORTSFCMobileSoccer.webp, ../app/cloud.html?game=com.ea.gp.fifamobile, cloud
Fortnite, ../media/cloudimages/icon_Fortnite.webp, ../app/cloud.html?game=com.epicgames.fortnite, cloud
Genshin Impact, ../media/cloudimages/icon_GenshinImpact.webp, ../app/cloud.html?game=com.miHoYo.GenshinImpact, cloud
Among Us, ../media/cloudimages/icon_AmongUs.webp, ../app/cloud.html?game=com.innersloth.spacemafia, cloud
Madden NFL 26 Mobile Football, ../media/cloudimages/icon_MaddenNFL26MobileFootball.webp, ../app/cloud.html?game=com.ea.gp.maddennfl21mobile, cloud
Clash of Clans, ../media/cloudimages/icon_ClashofClans.webp, ../app/cloud.html?game=com.supercell.clashofclans, cloud
Geometry Dash Lite, ../media/cloudimages/icon_GeometryDashLite.webp, ../app/cloud.html?game=com.robtopx.geometryjumplite, cloud
Block Blast!, ../media/cloudimages/icon_BlockBlast.webp, ../app/cloud.html?game=com.block.juggle, cloud
Survivor.io, ../media/cloudimages/icon_Survivorio.webp, ../app/cloud.html?game=com.dxx.firenow, cloud
Minecraft Education, ../media/cloudimages/icon_MinecraftEducation.webp, ../app/cloud.html?game=com.mojang.minecraftedu, cloud
Melon Sandbox, ../media/cloudimages/icon_MelonSandbox.webp, ../app/cloud.html?game=com.studio27.MelonPlayground, cloud
Toca Boca World, ../media/cloudimages/icon_TocaBocaWorld.webp, ../app/cloud.html?game=com.tocaboca.tocalifeworld, cloud
Rocket League Sideswipe, ../media/cloudimages/icon_RocketLeagueSideswipe.webp, ../app/cloud.html?game=com.Psyonix.RL2D, cloud
PUBG MOBILE, ../media/cloudimages/icon_PUBGMOBILE.webp, ../app/cloud.html?game=com.tencent.ig, cloud
Stumble Guys, ../media/cloudimages/icon_StumbleGuys.webp, ../app/cloud.html?game=com.kitkagames.fallbuddies, cloud
Granny, ../media/cloudimages/icon_Granny.webp, ../app/cloud.html?game=com.dvloper.granny, cloud
Call of Duty®: Mobile, ../media/cloudimages/icon_CallofDutyMobile.webp, ../app/cloud.html?game=com.activision.callofduty.shooter, cloud
Zalith Launcher 2 for Minecraft, ../media/cloudimages/icon_ZalithLauncher2forMinecraft.webp, ../app/cloud.html?game=com.movtery.zalithlauncher.v2, cloud
Subway Surfers, ../media/cloudimages/icon_SubwaySurfers.webp, ../app/cloud.html?game=com.kiloo.subwaysurf, cloud
Plants vs. Zombies™, ../media/cloudimages/icon_PlantsvsZombies.webp, ../app/cloud.html?game=com.ea.game.pvzfree_row, cloud
My Singing Monsters, ../media/cloudimages/icon_MySingingMonsters.webp, ../app/cloud.html?game=com.bigbluebubble.singingmonsters.full, cloud
Fall Guys, ../media/cloudimages/icon_FallGuys.webp, ../app/cloud.html?game=com.Mediatonic.FallGuys_client, cloud
Retro Bowl, ../media/cloudimages/icon_RetroBowl.webp, ../app/cloud.html?game=com.newstargames.retrobowl, cloud
Candy Crush Saga, ../media/cloudimages/icon_CandyCrushSaga.webp, ../app/cloud.html?game=com.king.candycrushsaga, cloud
Squad Busters, ../media/cloudimages/icon_SquadBusters.webp, ../app/cloud.html?game=com.supercell.squad, cloud
Roblox 2, ../media/gameimages/roblox.png, https://nowgg.fun/apps/a/19900/b.html
Fortnite 2, ../media/gameimages/fortnite.webp, https://nowgg.fun/apps/aptoide/5874/aptoide.html?deep_link=aptoidesearch://com.epicgames.fortnite
Rat Simulator, ../media/gameimages/rat.png, https://ratcar.netlify.app/
1v1.lol, ../media/gameimages/1v1lol.png, https://1v1lol-unblocked-free.github.io/
Minecraft, ../media/gameimages/minecraft.png, https://4texas4.github.io/EaglyMC/
`;

  const rawToolsList = `
Blooket, ../media/toolsimages/blooket.png, ../tools/blk2.html
Cloud Moon, ../media/toolsimages/cloudmoon.png, ../tools/cloudmoon.html
Unb10ck3r$, ../media/toolsimages/unblocked.png, ../tools/unbl0ck3rs.html
Chat, ../media/toolsimages/chat.png, https://4texas4.github.io/tools/chat/
AI, ../media/toolsimages/ai.png, ../tools/ai
AI Image Generator, ../media/toolsimages/ai-image-generator.jpg, ../tools/ai-image-generator.html
Soundboard, ../media/toolsimages/soundboard.jpg, ../tools/soundboard.html
Code Editor, ../media/toolsimages/codeeditor.png, ../tools/codeeditor.html
Data URL Maker, ../media/toolsimages/data.png, ../tools/base.html
Ewasion, ../media/toolsimages/ewasion.png, ../tools/ewasion.html
Internet Archive, ../media/toolsimages/internet-archive.png, https://archive.org/
Clock, ../media/toolsimages/clock.png, ../tools/clock.html
Emulator, ../media/toolsimages/emulator.png, ../tools/emu.html
Random Website, ../media/toolsimages/button.png, ../tools/random.html
Chrome, ../media/cloudimages/icon_Chrome.webp, ../app/cloud.html?game=com.android.chrome, cloud
TikTok, ../media/cloudimages/icon_TikTok.webp, ../app/cloud.html?game=com.zhiliaoapp.musically, cloud
YouTube, ../media/cloudimages/icon_YouTube.webp, ../app/cloud.html?game=com.google.android.youtube, cloud
Discord - Talk, Play, Hang Out, ../media/cloudimages/icon_DiscordTalkPlayHangOut.webp, ../app/cloud.html?game=com.discord, cloud
`;

  function parseList(raw) {
    return raw.trim().split('\n').map(line => {
      const parts = line.split(',').map(s => s.trim());
      const title = parts[0] ?? '';
      const img = parts[1] ?? '';
      const lastPart = parts[parts.length - 1].toLowerCase();
      const isCloud = lastPart === 'cloud';
      const linkParts = isCloud ? parts.slice(2, -1) : parts.slice(2);
      const link = linkParts.join(',').trim();
      return [title, img, link, isCloud];
    }).filter(([t,,l]) => t && l);
  }

  const gamesList = parseList(rawGameList);
  const toolsList = parseList(rawToolsList);

  const grid = document.getElementById('game-grid');
  const searchEl = document.getElementById('search');
  const titleEl = document.getElementById('page-title');
  const btnGames = document.getElementById('btn-games');
  const btnTools = document.getElementById('btn-tools');

  let currentMode = location.search.includes('tools') ? 'tools' : 'games';
  let currentList = currentMode === 'tools' ? toolsList : gamesList;

  function renderList(list) {
    grid.innerHTML = '';
    const frag = document.createDocumentFragment();
    list.forEach(([title, img, link, isCloud]) => {
      const shouldProxy = useProxy || ALWAYS_PROXY.includes(title);
      let finalLink = link;
      if (shouldProxy && !link.includes('proxy.texas-projects.xyz')) {
        finalLink = PROXY_PREFIX + link;
      }
      const card = document.createElement('div');
      card.className = 'game-card';
      card.setAttribute('role', 'link');
      card.tabIndex = 0;
      card.onclick = () => window.location.href = finalLink;
      card.onkeyup = e => { if (e.key === 'Enter') window.location.href = finalLink; };

      const badgeHTML = isCloud ? `<div class="cloud-badge" aria-label="Cloud game"><span class="dot"></span><span class="label">Cloud</span></div>` : '';

      card.innerHTML = `
        <div class="img-wrap">
          <img src="${img}" alt="${title}" loading="lazy">
          ${badgeHTML}
        </div>
        <span title="${title}">${title}</span>`;
      frag.appendChild(card);
    });
    grid.appendChild(frag);
  }

  function applyMode(mode, push) {
    currentMode = mode;
    const isTools = mode === 'tools';
    currentList = isTools ? toolsList : gamesList;

    const label = isTools ? 'TOOLS' : 'GAMES';
    titleEl.textContent = label;
    titleEl.classList.remove('wave');

    const text = titleEl.textContent;
    titleEl.textContent = '';
    [...text].forEach((char, i) => {
      const span = document.createElement('span');
      span.textContent = char === ' ' ? '\u00A0' : char;
      span.style.animationDelay = `${i * 0.08}s`;
      titleEl.appendChild(span);
    });
    titleEl.classList.add('wave');

    document.title = isTools ? 'Tools' : 'Games';
    searchEl.placeholder = isTools ? 'Search tools...' : 'Search games...';
    searchEl.value = '';

    btnGames.classList.toggle('active', !isTools);
    btnTools.classList.toggle('active', isTools);

    if (push) {
      history.pushState({ mode }, '', isTools ? location.pathname + '?tools' : location.pathname);
    }

    window.parent.postMessage({ type: 'modeChange', mode }, '*');
    renderList(currentList);
  }

  function setMode(mode) { applyMode(mode, true); }

  window.addEventListener('popstate', () => {
    applyMode(location.search.includes('tools') ? 'tools' : 'games', false);
  });

  applyMode(currentMode, false);

  searchEl.addEventListener('input', () => {
    const q = searchEl.value.toLowerCase().trim();
    renderList(q ? currentList.filter(([t]) => t.toLowerCase().includes(q)) : currentList);
  });

  function updateTime() {
    const now = new Date();
    let hh = now.getHours();
    const ampm = hh >= 12 ? 'PM' : 'AM';
    hh = hh % 12 || 12;
    const mm = String(now.getMinutes()).padStart(2, '0');
    const ss = String(now.getSeconds()).padStart(2, '0');
    document.getElementById('time').innerHTML = `${hh}:${mm}:<span class="seconds">${ss}</span><span class="ampm">${ampm}</span>`;
  }
  setInterval(updateTime, 1000);
  updateTime();

  const batteryText = document.getElementById('battery-text');
  if (navigator.getBattery) {
    navigator.getBattery().then(b => {
      const upd = () => batteryText.textContent = `${Math.round(b.level * 100)}%`;
      b.addEventListener('levelchange', upd);
      b.addEventListener('chargingchange', upd);
      upd();
    });
  } else { batteryText.textContent = 'N/A'; }
</script>
</body>
</html>
