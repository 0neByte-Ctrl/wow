<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap">
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Home</title>
  <style>
    :root {
      --bg0: #060b1a;
      --bg1: #0c162d;
      --bg2: #111827;
      --panel: rgba(11, 17, 34, 0.72);
      --panel-strong: rgba(13, 19, 35, 0.9);
      --stroke: rgba(103, 232, 255, 0.22);
      --stroke-strong: rgba(103, 232, 255, 0.38);
      --text: #dffcff;
      --muted: #9ac7d3;
      --accent: #67e8ff;
      --accent-2: #8b5cf6;
      --pink: #ff4fd8;
      --shadow: rgba(103, 232, 255, 0.25);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }

    body {
      height: 100vh;
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--text);
      overflow: hidden;
      position: relative;
    }

    .bold { font-weight: 900; }

    body::before {
      position: fixed;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(6, 11, 26, 0.15) 0%,
        rgba(6, 11, 26, 0.35) 45%,
        rgba(6, 11, 26, 0.7) 100%
      );
      z-index: 0;
      pointer-events: none;
      content: '';
    }

    h1 {
      font-size: 7rem;
      font-weight: 700;
      text-align: center;
      z-index: 1;
      position: relative;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-shadow: 0 0 8px rgba(103, 232, 255, 0.25), 0 0 18px rgba(139, 92, 246, 0.2), 0 0 34px rgba(103, 232, 255, 0.2);
    }

    .wave span {
      display: inline-block;
      animation: wave 3.5s ease-in-out infinite;
    }

    @keyframes wave {
      0%   { transform: translateY(0); }
      50%  { transform: translateY(-15px); }
      100% { transform: translateY(0); }
    }

    footer {
      position: absolute;
      bottom: 20px;
      display: flex;
      gap: 30px;
      font-size: 1.5rem;
      align-items: center;
      z-index: 1;
      flex-wrap: wrap;
      justify-content: center;
      color: var(--text);
    }

    footer span {
      display: flex;
      align-items: center;
      position: relative;
      padding: 0 6px;
    }

    footer > span:not(:last-child)::after {
      content: '';
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 1px;
      height: 60%;
      background: rgba(103, 232, 255, 0.3);
    }

    a { color: var(--text); text-decoration: none; }
    a:hover { text-decoration: underline; }

    #time { display: flex; align-items: center; gap: 2px; }
    .seconds { color: rgba(223, 252, 255, 0.7); font-weight: 400; margin-left: -5px; }
    .ampm { color: rgba(223, 252, 255, 0.8); font-size: 0.8em; margin-left: -8px; }

    .battery { display:flex; align-items:center; gap:3px; }
    .battery svg { width:24px; height:24px; stroke: var(--text); }

    @media (max-width:600px) {
      footer { flex-direction: column; gap: 12px; bottom: 10px; font-size: 1.1rem; }
      footer span:not(:last-child)::after { display: none; }
      h1 { font-size: 4rem; letter-spacing: 0.08em; }
    }
  </style>
</head>
<body>
  <h1 id="wave-title" class="bold">HOME</h1>

  <footer>
    <span id="time">--:<span class="seconds">--</span><span class="ampm">--</span></span>

    <span class="battery">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="1" y="6" width="18" height="12" rx="2" ry="2"></rect>
        <line x1="23" y1="13" x2="23" y2="11"></line>
      </svg>
      <span id="battery-text">--%</span>
    </span>

    <span><a href="https://discord.gg/6Sp3DJMvCU" target="_blank" rel="noopener">Discord</a></span>
  </footer>

<script>
  function updateTime() {
    const now = new Date();
    let hh = now.getHours();
    const ampm = hh >= 12 ? 'PM' : 'AM';
    hh = hh % 12 || 12;
    const mm = String(now.getMinutes()).padStart(2,'0');
    const ss = String(now.getSeconds()).padStart(2,'0');
    document.getElementById('time').innerHTML = `${hh}:${mm}:<span class="seconds">${ss}</span><span class="ampm">${ampm}</span>`;
  }
  setInterval(updateTime,1000);
  updateTime();

  const batteryText = document.getElementById('battery-text');
  if (navigator.getBattery) {
    navigator.getBattery().then(b => {
      function upd() { batteryText.textContent = `${Math.round(b.level * 100)}%`; }
      b.addEventListener('levelchange', upd);
      b.addEventListener('chargingchange', upd);
      upd();
    });
  } else { batteryText.textContent = 'N/A'; }

  const title = document.getElementById('wave-title');
  const text = title.textContent;
  title.textContent = '';

  [...text].forEach((char, i) => {
    const span = document.createElement('span');
    span.textContent = char === ' ' ? '\u00A0' : char;
    span.style.animationDelay = `${i * 0.12}s`;
    title.appendChild(span);
  });

  title.classList.add('wave');
</script>
</body>
</html>
