<!DOCTYPE html>

<head>

<title>Neon Arcade Proxy</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root {
    --bg0: #060b1a;
    --bg1: #0b1220;
    --bg2: #111827;
    --accent: #67e8ff;
    --accent-2: #8b5cf6;
    --panel: rgba(11, 17, 34, 0.9);
    --text: #dffcff;
  }

  * { box-sizing: border-box; font-family: Arial, Helvetica, sans-serif; }
  body {
    margin: 0; min-height: 100vh;
    background: radial-gradient(circle at top, #0f172a, #060b1a 65%);
    color: var(--text);
    display: flex; flex-direction: column; justify-content: space-between; align-items: center;
  }
  .center { flex: 1; display: flex; align-items: center; justify-content: center; }
  .main-btn {
    font-size: 3rem; padding: 30px 80px; border-radius: 18px; border: none;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #041018; font-weight: 900; cursor: pointer;
    box-shadow: 0 20px 40px rgba(103, 232, 255, 0.35);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .main-btn:hover { transform: scale(1.05); box-shadow: 0 30px 60px rgba(103, 232, 255, 0.45); }
  .bottom { width: 100%; padding: 25px 20px 35px; background: rgba(11,17,34,0.5); backdrop-filter: blur(10px); }
  .bottom h2 { margin: 0 0 15px; text-align: center; font-size: 1.3rem; opacity: 0.9; }
  .button-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; max-width: 1100px; margin: 0 auto; }
  .alt-btn {
    padding: 12px 10px; border-radius: 10px; border: 1px solid rgba(103, 232, 255, 0.18);
    background: rgba(5, 10, 20, 0.7); color: var(--text); cursor: pointer; font-size: 0.95rem;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .alt-btn:hover { background: rgba(103, 232, 255, 0.12); transform: translateY(-2px); }
  @media(max-width:600px){ .main-btn{ font-size:2.2rem; padding:25px 50px; } }
</style>
</head>
<body>
  <div class="center">
    <button class="main-btn" onclick="window.location.href='https://proxy.texas-projects.xyz'">Neon Arcade Proxy</button>
  </div>

  <div class="bottom">

    <div class="button-grid">

      <button class="alt-btn" onclick="window.location.href='https://www.browserling.com/browse/win10/chrome126/https://neonarcade.app'">Browserling Windows (VM)</button>
